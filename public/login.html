<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Entrar — Verdugo</title>
  <link rel="icon" href="/img/favicon.png">
  <link rel="stylesheet" href="/estilo.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login">
      <img src="/img/logo.jpg" alt="Verdugo Barbearia e Prótese Capilar">
      <form class="card form" id="form-login" autocomplete="on">
        <h2>Entrar</h2>
        <label>E-mail<input type="email" name="email" autocomplete="username" required></label>
        <label>Senha<input type="password" name="senha" autocomplete="current-password" required></label>
        <div id="erro" class="alert red hidden" role="alert"></div>
        <button class="btn primario" type="submit">Entrar</button>
      </form>
      <p class="aviso">Acesso restrito ao proprietário.</p>
    </div>
  </div>
  <script src="/login.js"></script>
</body>
</html>
